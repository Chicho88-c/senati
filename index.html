<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#d91023">
  <title>Iniciar sesión | SENATI</title>
  <style>
    *{box-sizing:border-box} 
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(90deg,#d91023 0%,#d91023 28%,#ffffff 28%,#ffffff 72%,#d91023 72%,#d91023 100%);font-family:Inter,Arial,sans-serif;color:#171717}
    .shell{width:min(100%,430px)}
    .brand{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:26px;letter-spacing:.18em;font-size:13px;font-weight:800;color:#171717}
    .brand-mark{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(90deg,#d91023 0 33.33%,#ffffff 33.33% 66.66%,#d91023 66.66%);color:#d91023;font-size:18px;letter-spacing:0}
    .panel{padding:38px 34px 30px;background:rgba(19,20,26,.88);border:1px solid #30313a;border-radius:22px;box-shadow:0 24px 80px #0009;backdrop-filter:blur(16px)}
    .eyebrow{margin:0 0 9px;color:#a3a6b2;text-transform:uppercase;letter-spacing:.16em;font-size:10px;font-weight:700}
    h1{margin:0;font-size:29px;letter-spacing:-.04em}
    .sub{margin:10px 0 28px;color:#9b9daa;font-size:14px;line-height:1.55}
    label{display:block;margin:17px 0 8px;font-size:12px;font-weight:700;color:#d7d8df}
    .field{position:relative}
    input{width:100%;height:49px;padding:0 14px;border:1px solid #383a45;border-radius:11px;background:#0d0e13;color:#fff;font-size:14px;outline:none;transition:.2s}
    input:focus{border-color:#ef3340;box-shadow:0 0 0 3px #ef334022}
    input::placeholder{color:#686b77}
    .toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);border:0;background:none;color:#aeb0bb;font-size:11px;cursor:pointer}
    .options{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:17px 0 23px;font-size:12px;color:#aeb0bb}
    .remember{display:flex;align-items:center;gap:8px}.remember input{width:14px;height:14px;accent-color:#ef3340}
    a{color:#ff6670;text-decoration:none}a:hover{text-decoration:underline}
    .submit{width:100%;height:49px;border:0;border-radius:11px;background:#d91023;color:#ffffff;font-size:13px;font-weight:800;letter-spacing:.04em;cursor:pointer;transition:transform .18s,background .18s}
    .submit:hover{background:#b80d1d;transform:translateY(-1px)}
    .message{min-height:18px;margin:13px 0 0;text-align:center;color:#ff6670;font-size:12px}
    .footer{margin:22px 0 0;text-align:center;color:#7f1020;font-size:11px;line-height:1.6}
    @media(max-width:480px){.panel{padding:30px 23px}.brand{margin-bottom:20px}h1{font-size:26px}}
  </style>
</head>
<body>
  <main class="shell">
    <div class="brand"><span class="brand-mark">S</span><span>SENATI</span></div>
    <section class="panel" aria-labelledby="title">
      <p class="eyebrow">Portal de acceso</p>
      <h1 id="title">Bienvenido</h1>
      <p class="sub">Ingresa tus datos para continuar a tu espacio de trabajo.</p>
      <form id="loginForm">
        <label for="email">Correo electrónico</label>
        <div class="field"><input id="email" name="email" type="email" placeholder="nombre@correo.com" autocomplete="username" required></div>
        <label for="password">Contraseña</label>
        <div class="field"><input id="password" name="password" type="password" placeholder="Ingresa tu contraseña" autocomplete="current-password" required><button class="toggle" type="button" id="togglePassword">MOSTRAR</button></div>
        <div class="options">
          <label class="remember"><input type="checkbox" name="remember"> Recordarme</label>
          <a href="#" id="forgot">¿Olvidaste tu contraseña?</a>
        </div>
        <button class="submit" type="submit">INICIAR SESIÓN</button>
        <p class="message" id="message" role="status" aria-live="polite"></p>
      </form>
    </section>
    <p class="footer">Acceso de demostración · Interfaz adaptable a celulares y computadoras<br>© 2026 SENATI</p>
  </main>
  <script>
    const password = document.getElementById('password');
    const toggle = document.getElementById('togglePassword');
    const message = document.getElementById('message');
    toggle.addEventListener('click', () => {
      const showing = password.type === 'text';
      password.type = showing ? 'password' : 'text';
      toggle.textContent = showing ? 'MOSTRAR' : 'OCULTAR';
    });
    document.getElementById('loginForm').addEventListener('submit', event => {
      event.preventDefault();
      message.textContent = 'Diseño de demostración: conecta un servidor para validar las credenciales.';
    });
    document.getElementById('forgot').addEventListener('click', event => {
      event.preventDefault();
      message.textContent = 'Contacta al administrador para recuperar tu acceso.';
    });
  </script>
</body>
</html>
